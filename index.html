<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: app a schermo intero, barra blu con schede dei gruppi in alto, canali sotto (griglia o elenco), lettore sovrapposto. */
:root {
  --bar: #1b5fb5;
  --bar-deep: #154c93;
  --on-bar: #ffffff;
  --on-bar-dim: rgba(255, 255, 255, .72);
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f3f5f9;
  --tile: #ffffff;
  --tile-line: #dfe4ec;
  --fg: #141b26;
  --muted: #5a6677;
  --line: #dde3ec;
  --accent: #1b66d2;
  --accent-soft: #e2ebfa;
  --star: #e09b00;
  --danger: #c5221f;
  --scrim: rgba(8, 14, 24, .5);
  --shadow: 0 10px 30px rgba(10, 22, 44, .22);
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --tile-size: 52px;
  --tile-min: 76px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bar: #1d5aa8; --bar-deep: #17497f; --bg: #1c1f25; --surface: #262a31; --surface-2: #2e333b;
    --tile: #f1f3f7; --tile-line: #f1f3f7; --fg: #e9ecf1; --muted: #9ba5b4; --line: #343a43;
    --accent: #82b1ff; --accent-soft: #2b3a52; --star: #ffc53d; --danger: #ff8a80; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bar: #1d5aa8; --bar-deep: #17497f; --bg: #1c1f25; --surface: #262a31; --surface-2: #2e333b;
  --tile: #f1f3f7; --tile-line: #f1f3f7; --fg: #e9ecf1; --muted: #9ba5b4; --line: #343a43;
  --accent: #82b1ff; --accent-soft: #2b3a52; --star: #ffc53d; --danger: #ff8a80; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.4 var(--font); -webkit-tap-highlight-color: transparent; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar-deep); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
input, textarea, select { font: inherit; color: var(--fg); }
img { max-width: 100%; }
.i { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.top { background: var(--bar); color: var(--on-bar); flex: none; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); position: relative; z-index: 2; }
.appbar, .searchbar { height: 56px; display: flex; align-items: center; gap: 2px; padding: 0 4px; }
.title { flex: 1; min-width: 0; font-size: 20px; font-weight: 500; padding-left: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .1px; }
.ib { width: 48px; height: 48px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: inherit; flex: none; }
.ib:hover { background: rgba(127, 127, 127, .14); }
.ib:active { background: rgba(127, 127, 127, .24); }
.searchbar input { flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; color: var(--on-bar); font-size: 18px; outline: none; padding: 0 8px; }
.searchbar input::placeholder { color: var(--on-bar-dim); }
.searchbar input::-webkit-search-cancel-button { display: none; }
.tabs { display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; color: var(--on-bar-dim); height: 48px; padding: 0 16px; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: .6px; cursor: pointer; position: relative; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--on-bar); }

.loadbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; overflow: hidden; }
.loadbar i { position: absolute; top: 0; bottom: 0; width: 35%; background: #9cc3ff; animation: lb 1.1s ease-in-out infinite; }
@keyframes lb { from { left: -35%; } to { left: 100%; } }
.status { background: var(--accent-soft); color: var(--fg); font-size: 13px; padding: 8px 16px; display: flex; gap: 12px; align-items: center; }
.status span { flex: 1; min-width: 0; }
.status button { border: 0; background: none; color: var(--accent); font-weight: 500; text-transform: uppercase; font-size: 13px; letter-spacing: .4px; cursor: pointer; padding: 6px 4px; }

#main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.res-h { padding: 14px 16px 4px; color: var(--muted); font-size: 13px; }
#list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile-min), 1fr)); gap: 2px 0; padding: 8px 4px 24px; }
#list.rows { display: flex; flex-direction: column; padding-bottom: 24px; }
.ch { border: 0; background: none; cursor: pointer; text-align: left; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; position: relative; }
.grid .ch { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 2px 8px; border-radius: 10px; min-width: 0; }
.grid .ch:hover { background: rgba(127, 127, 127, .1); }
.grid .nm { font-size: 12.5px; color: var(--fg); text-align: center; width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; word-break: break-word; }
.rows .ch { display: flex; align-items: center; gap: 16px; min-height: 68px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
.rows .ch:hover { background: var(--surface-2); }
.rows .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rows .nm { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 4px; max-width: 220px; }
.pb i { display: block; height: 100%; background: var(--accent); }
.av { width: var(--tile-size); height: var(--tile-size); flex: none; border-radius: 10px; background: var(--tile); border: 1px solid var(--tile-line); display: grid; place-items: center; overflow: hidden; position: relative; }
.rows .av { width: 46px; height: 46px; }
.av img { width: 86%; height: 86%; object-fit: contain; position: absolute; inset: 7%; opacity: 0; transition: opacity .15s; }
.av.has-logo img { opacity: 1; }
.av.has-logo b { visibility: hidden; }
.av b { width: 72%; height: 72%; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 500; font-size: calc(var(--tile-size) * .36); background: var(--c, #5c6bc0); }
.rows .av b { font-size: 17px; }
.favdot { position: absolute; top: 6px; right: 8px; color: var(--star); }
.grid .favdot .i { width: 16px; height: 16px; }
.rows .favdot { position: static; }
.rows .favdot .i { width: 20px; height: 20px; }
.empty { padding: 56px 24px; text-align: center; color: var(--muted); max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .i { width: 56px; height: 56px; opacity: .45; }
.empty h3 { margin: 0; color: var(--fg); font-size: 17px; font-weight: 500; text-wrap: balance; }
.empty p { margin: 0; line-height: 1.5; }

/* strati: menu laterale, menu, fogli, finestre */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(320px, 86vw); background: var(--surface); z-index: 21; display: flex; flex-direction: column; box-shadow: var(--shadow); animation: slide .2s ease-out; padding-bottom: env(safe-area-inset-bottom, 0px); }
@keyframes slide { from { transform: translateX(-100%); } }
.dr-head { background: var(--bar); color: var(--on-bar); padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px 18px max(20px, env(safe-area-inset-left, 0px)); display: flex; gap: 14px; align-items: center; }
.dr-head svg.logo { width: 48px; height: 48px; flex: none; }
.dr-head b { display: block; font-size: 19px; font-weight: 500; }
.dr-head small { color: var(--on-bar-dim); font-size: 13px; }
.dr-body { flex: 1; overflow-y: auto; padding: 8px 0; }
.dr-label { font-size: 12px; font-weight: 500; color: var(--muted); padding: 12px 20px 6px; text-transform: uppercase; letter-spacing: .8px; }
.dr-item { display: flex; align-items: center; gap: 18px; width: 100%; border: 0; background: none; padding: 0 8px 0 20px; min-height: 52px; cursor: pointer; text-align: left; color: var(--fg); }
.dr-item:hover { background: var(--surface-2); }
.dr-item .i { color: var(--muted); }
.dr-item .tx { flex: 1; min-width: 0; }
.dr-item .tx b { display: block; font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dr-item .tx small { color: var(--muted); font-size: 12.5px; }
.dr-item.on { background: var(--accent-soft); }
.dr-item.on .i, .dr-item.on b { color: var(--accent); }
.dr-sep { height: 1px; background: var(--line); margin: 8px 0; }
.menu { position: fixed; z-index: 31; top: calc(env(safe-area-inset-top, 0px) + 8px); right: calc(env(safe-area-inset-right, 0px) + 8px); background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 0; min-width: 240px; max-width: calc(100vw - 16px); animation: pop .14s ease-out; transform-origin: top right; }
@keyframes pop { from { opacity: 0; transform: scale(.92); } }
.menu button { display: flex; width: 100%; align-items: center; gap: 16px; border: 0; background: none; padding: 0 20px 0 16px; height: 48px; cursor: pointer; font-size: 15px; text-align: left; color: var(--fg); }
.menu button:hover { background: var(--surface-2); }
.menu button .i { color: var(--muted); }
.menu .chk { margin-left: auto; color: var(--accent); }
.menu-sep { height: 1px; background: var(--line); margin: 6px 0; }
.menu-label { font-size: 12px; color: var(--muted); padding: 8px 16px 4px; text-transform: uppercase; letter-spacing: .8px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow); max-height: 82vh; overflow-y: auto; padding: 8px 0 calc(env(safe-area-inset-bottom, 0px) + 8px); animation: up .2s ease-out; max-width: 640px; margin: 0 auto; }
@keyframes up { from { transform: translateY(100%); } }
.sh-head { display: flex; gap: 14px; align-items: center; padding: 14px 20px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.sh-head .tx { min-width: 0; flex: 1; }
.sh-head b { display: block; font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.sh-head small { color: var(--muted); font-size: 13px; display: block; }
.sheet .menu-btn { display: flex; width: 100%; align-items: center; gap: 20px; border: 0; background: none; padding: 0 20px; min-height: 52px; cursor: pointer; font-size: 15px; text-align: left; color: var(--fg); }
.sheet .menu-btn:hover { background: var(--surface-2); }
.sheet .menu-btn .i { color: var(--muted); }
.sheet .menu-btn.danger, .sheet .menu-btn.danger .i { color: var(--danger); }
.guide { list-style: none; margin: 0; padding: 0 20px 12px; }
.guide li { display: grid; grid-template-columns: 54px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.guide time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 1px; }
.guide li.now time, .guide li.now b { color: var(--accent); }
.guide b { font-weight: 500; display: block; }
.guide p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.dlg-wrap { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .15s ease-out; }
.dlg { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 440px; max-height: 100%; display: flex; flex-direction: column; animation: pop .16s ease-out; }
.dlg.wide { max-width: 560px; }
.dlg-t { margin: 0; font-size: 20px; font-weight: 500; padding: 22px 24px 8px; text-wrap: balance; }
.dlg-b { padding: 8px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.dlg-b p { margin: 0; line-height: 1.5; color: var(--muted); }
.dlg-a { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 16px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 20px; height: 40px; padding: 0 18px; font-weight: 500; font-size: 14px; letter-spacing: .3px; cursor: pointer; }
.btn.text { background: none; color: var(--accent); }
.btn.text:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--surface); }
.btn.primary:disabled { opacity: .5; cursor: default; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld label { font-size: 13px; font-weight: 500; color: var(--muted); }
.fld input, .fld textarea, .fld select { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 11px 12px; font-size: 15px; outline: none; }
.fld input:focus, .fld textarea:focus, .fld select:focus { border-color: var(--accent); }
.fld textarea { min-height: 130px; resize: vertical; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.fld .hint { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 8px; height: 36px; font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; height: 32px; padding: 0 12px; font-size: 13px; cursor: pointer; color: var(--fg); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.err { color: var(--danger); font-size: 13.5px; line-height: 1.45; }
.set-sec { font-size: 12px; font-weight: 500; color: var(--accent); text-transform: uppercase; letter-spacing: .8px; margin-top: 6px; }
.sw { display: flex; align-items: center; gap: 14px; cursor: pointer; }
.sw .tx { flex: 1; min-width: 0; }
.sw .tx b { display: block; font-weight: 400; font-size: 15px; }
.sw .tx small { color: var(--muted); font-size: 12.5px; line-height: 1.4; display: block; }
.sw input { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; border-radius: 12px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; margin: 0; }
.sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
.sw input:checked { background: var(--accent); }
.sw input:checked::after { transform: translateX(16px); }
.help { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.55; display: flex; flex-direction: column; gap: 6px; }
.help b { color: var(--fg); font-weight: 500; }
kbd { font: 12px ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: var(--surface-2); color: var(--fg); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 60; background: #2b3038; color: #f2f4f7; border-radius: 8px; padding: 12px 18px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); animation: fade .2s ease-out; }

/* lettore */
.player { position: fixed; inset: 0; z-index: 50; background: #000; color: #fff; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.player.fit-cover video { object-fit: cover; }
.player.fit-fill video { object-fit: fill; }
.p-ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; opacity: 0; transition: opacity .2s; pointer-events: none; }
.p-ui.show { opacity: 1; pointer-events: auto; }
.p-top { display: flex; align-items: center; gap: 2px; padding: calc(env(safe-area-inset-top, 0px) + 4px) max(4px, env(safe-area-inset-right, 0px)) 28px max(4px, env(safe-area-inset-left, 0px)); background: linear-gradient(rgba(0, 0, 0, .72), transparent); }
.p-title { flex: 1; min-width: 0; padding-left: 8px; }
.p-title div:first-child { font-size: 18px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-title div:last-child { font-size: 13px; color: rgba(255, 255, 255, .72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-mid { display: flex; align-items: center; justify-content: center; gap: 28px; }
.p-mid .ib { background: rgba(0, 0, 0, .38); }
.p-mid .big { width: 56px; height: 56px; }
.p-mid .big .i { width: 32px; height: 32px; }
.p-mid .huge { width: 72px; height: 72px; }
.p-mid .huge .i { width: 44px; height: 44px; }
.p-bot { padding: 32px max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px) max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(transparent, rgba(0, 0, 0, .78)); display: flex; flex-direction: column; gap: 4px; }
.p-row { display: flex; align-items: center; gap: 2px; }
.p-epg { flex: 1; min-width: 0; font-size: 13.5px; padding-left: 4px; display: flex; flex-direction: column; gap: 2px; }
.p-epg .now { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-epg .next { color: rgba(255, 255, 255, .7); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-epg .pb { background: rgba(255, 255, 255, .25); max-width: 320px; }
.p-epg .pb i { background: #fff; }
.p-live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .8px; }
.p-live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ff4d4d; }
.p-seek { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-variant-numeric: tabular-nums; padding: 0 4px; }
.p-seek input { flex: 1; min-width: 0; accent-color: #fff; }
.p-spin { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.p-spin i { width: 48px; height: 48px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .25); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.p-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; z-index: 2; background: rgba(0, 0, 0, .82); }
.player.has-msg .p-mid, .player.has-msg #pSpin { visibility: hidden; }
.p-msg .box { max-width: 440px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.p-msg .i { width: 44px; height: 44px; opacity: .85; }
.p-msg h3 { margin: 0; font-size: 18px; font-weight: 500; text-wrap: balance; }
.p-msg p { margin: 0; color: rgba(255, 255, 255, .8); line-height: 1.5; font-size: 14px; }
.p-msg .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.p-msg .btn { background: rgba(255, 255, 255, .14); color: #fff; }
.p-msg .btn.primary { background: #fff; color: #10151d; }

    h("div", { class: "set-sec", text: "Dati" }),
    h("div", { class: "chips" },
      h("button", { class: "chip", type: "button", onclick: () => { if (!S.pl) return; S.recs = []; store.set("rec." + S.pl.id, []); if (S.tab === TAB_REC) render(true); toast("Recenti cancellati"); } }, "Cancella i recenti"),
      h("button", { class: "chip", type: "button", onclick: async () => { if (await installDefault(true)) toast("Lista predefinita ripristinata"); } }, "Ripristina la lista predefinita")),
  ];
  dialog({ title: "Impostazioni", wide: true, body, actions: [{ label: "Fatto", primary: true, run: () => { set("proxy", proxy.value.trim()); } }] });
}

  const li = (b, t) => h("li", {}, h("b", { text: b }), " " + t);
  dialog({ title: "Guida e formati", wide: true, body: [

    h("p", {}, "Tasti: ", h("kbd", { text: "↑" }), " ", h("kbd", { text: "↓" }), " cambia canale, ", h("kbd", { text: "Spazio" }), " pausa, ", h("kbd", { text: "F" }), " schermo intero, ", h("kbd", { text: "M" }), " audio, ", h("kbd", { text: "Esc" }), " chiude."),
    h("p", { text: "Tivù Player non fornisce canali: riproduce le playlist che aggiungi tu. Usa solo contenuti che hai il diritto di guardare." }),
  ], actions: [{ label: "Chiudi", primary: true }] });
}

// ======================= barra in alto, ricerca, tastiera =======================
function moreMenu() {
  const items = [];
  if (S.pl && S.pl.url) items.push({ icon: "refresh", label: "Aggiorna playlist", run: () => refreshPlaylist(S.pl) });
  if (S.pl && epgUrls(S.pl).length) items.push({ icon: "guide", label: "Aggiorna guida TV", run: () => loadEpg(S.pl, true) });
  items.push({ icon: "add", label: "Aggiungi playlist", run: () => playlistDialog() });
  items.push({ sep: true }, { label: "Ordina" });
  items.push({ icon: "sort", label: "Come nella playlist", checked: CFG.sort === "orig", run: () => { CFG.sort = "orig"; saveCfg(); render(true); } });
  items.push({ icon: "sort", label: "Per nome (A-Z)", checked: CFG.sort === "az", run: () => { CFG.sort = "az"; saveCfg(); render(true); } });
  items.push({ sep: true }, { icon: "settings", label: "Impostazioni", run: settingsDialog });
  popMenu(items);
}
let searchLayer = null, qT = 0;
function openSearch() {
  $("appbar").hidden = true; $("searchbar").hidden = false; $("tabs").hidden = true; $("q").value = S.q; setTimeout(() => $("q").focus(), 20);
  searchLayer = pushLayer(() => { S.q = ""; $("q").value = ""; $("searchbar").hidden = true; $("appbar").hidden = false; $("tabs").hidden = false; searchLayer = null; render(true); });
}
$("q").addEventListener("input", () => { clearTimeout(qT); qT = setTimeout(() => { S.q = $("q").value.trim(); render(true); }, 120); });
$("q").addEventListener("keydown", e => { if (e.key === "Enter") $("q").blur(); });
(() => {
  setIcon($("btnMenu"), "menu"); setIcon($("btnSearch"), "search"); setIcon($("btnCast"), "cast"); setIcon($("btnMore"), "more");
  setIcon($("btnSearchBack"), "back"); setIcon($("btnSearchClear"), "close");
  $("btnMenu").onclick = openDrawer; $("btnSearch").onclick = openSearch; $("btnMore").onclick = moreMenu;
  $("btnSearchBack").onclick = () => closeLayer(searchLayer);
  $("btnSearchClear").onclick = () => { $("q").value = ""; S.q = ""; render(true); $("q").focus(); };
  $("btnView").onclick = () => { CFG.view = CFG.view === "grid" ? "rows" : "grid"; saveCfg(); applyCfg(); const top = $("main").scrollTop; render(true); $("main").scrollTop = top; };
  $("btnCast").onclick = () => { if (Cast.ctx) { if (Cast.ctx.getCurrentSession()) Cast.ctx.endCurrentSession(true); else Cast.ctx.requestSession().catch(() => {}); } };
})();
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea,select")) { if (e.key === "Escape") { const L = topLayer(); if (L) closeLayer(L); } return; }
  if (!$("player").hidden && topLayer() === P.layer) {
    const k = e.key;
    if (k === "ArrowUp" || k === "PageUp" || k === "ChannelUp") { e.preventDefault(); zap(-1); }
    else if (k === "ArrowDown" || k === "PageDown" || k === "ChannelDown") { e.preventDefault(); zap(1); }
    else if (k === " " || k === "k" || k === "MediaPlayPause") { e.preventDefault(); togglePlay(); showUi(); }
    else if (k === "f" || k === "F") toggleFull();
    else if (k === "m" || k === "M") video.muted = !video.muted;
    else if (k === "Escape" && !document.fullscreenElement) closePlayer();
    else if (k === "ArrowLeft" || k === "ArrowRight") { if (isFinite(video.duration)) video.currentTime += k === "ArrowLeft" ? -10 : 10; showUi(); }
    return;
  }
  if (e.key === "Escape") { const L = topLayer(); if (L) closeLayer(L); }
  else if (e.key === "/" && !layers.length) { e.preventDefault(); openSearch(); }
});

// ======================= avvio =======================
(async function boot() {
  applyCfg();
  await refreshPlaylistsList();
  await dropDemo();
  if (!store.get("seededDefault", false)) { if (S.pls.some(p => p.id === DEFAULT_PL.id) || await installDefault(false)) store.set("seededDefault", true); }
  const cur = store.get("cur", null), pl = S.pls.find(p => p.id === cur) || S.pls[0];
  if (pl) await selectPlaylist(pl, { boot: true }); else { renderTabs(); render(true); }
  initCast();
  if (FRAMED) setStatus("Anteprima: dentro un'altra pagina (come claude.ai) i video e i loghi dei canali sono bloccati. Per guardare i canali apri l'app dal suo sito.");
  if (!FRAMED && "serviceWorker" in navigator && window.isSecureContext && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
