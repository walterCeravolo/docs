<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pagina non disponibile</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#ddd;font:16px system-ui,sans-serif;padding:16px}</style></head>
<body><p>Questa pagina non è più disponibile.</p>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if(window.caches)caches.keys().then(k=>k.forEach(n=>caches.delete(n)));</script></body></html>
